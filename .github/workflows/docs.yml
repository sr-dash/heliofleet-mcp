name: docs

# Documentation site (MkDocs Material, API pages from the numpydoc docstrings), on GitHub Pages
on:
  push:
    branches: [main]
    paths: ["src/**", "docs/**", "overrides/**", "mkdocs.yml", "pyproject.toml", "llms.txt",
            "CHANGELOG.md", ".github/workflows/docs.yml"]
  # Not on release: the github-pages environment deploys from main only, and a release's version
  # bump has already been pushed to main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ".[docs]"
      - name: Publish llms.txt with the site
        run: cp llms.txt docs/llms.txt
      - name: Build (strict: broken links and references fail the build)
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
