name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 2 * *"  # the day after HelioFleet's monthly data update

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14", coverage: true }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]" jplephem
      - run: python -m pytest -q ${{ matrix.coverage && '--cov --cov-report=term --cov-report=xml' || '' }}
        env:
          HELIOFLEET_TEST_SOURCE: web

  plugins:
    # The skill and the plugin manifests stay valid for each client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Skill (agentskills.io reference validator)
        run: |
          pip install "skills-ref @ git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          skills-ref validate skills/heliofleet
      - name: Agent Plugins manifest (plugin.json) against its JSON schema
        run: |
          pip install jsonschema
          curl -fsSL https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o /tmp/plugin.schema.json
          python -c "import json, jsonschema; jsonschema.validate(json.load(open('plugin.json')), json.load(open('/tmp/plugin.schema.json'))); print('plugin.json valid')"
      - name: Names and versions in step with the package
        run: python scripts/check_release.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check src tests scripts

  metadata:
    # Package and MCP Registry metadata stay consistent and valid
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py
      - run: pip install build twine
      - run: python -m build
      - run: python scripts/check_release.py --dist dist
      - run: twine check --strict dist/*
      - name: Installed wheel starts and lists its tools
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          /tmp/v/bin/python scripts/smoke_stdio.py /tmp/v/bin/heliofleet-mcp
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: scripts/get_mcp_publisher.sh
      - run: ./mcp-publisher validate server.json
