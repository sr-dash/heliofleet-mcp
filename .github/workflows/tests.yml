name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 2 * *"  # the day after HelioFleet's monthly data update

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]' jplephem
      - run: python -m pytest -q
        env:
          HELIOFLEET_TEST_SOURCE: web

  metadata:
    # Package and MCP Registry metadata stay consistent and valid
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py
      - run: pip install build twine
      - run: python -m build
      - run: python scripts/check_release.py --dist dist
      - run: twine check --strict dist/*
      - name: Installed wheel starts and lists its tools
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          /tmp/v/bin/python scripts/smoke_stdio.py /tmp/v/bin/heliofleet-mcp
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: scripts/get_mcp_publisher.sh
      - run: ./mcp-publisher validate server.json
