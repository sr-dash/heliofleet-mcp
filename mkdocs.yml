site_name: heliofleet-mcp
site_description: >-
  Heliophysics spacecraft positions, alignments, viewing geometry and solar magnetic connectivity
  from JPL Horizons ephemerides: an MCP server, a JSON command line and a Python API.
site_url: https://sr-dash.github.io/heliofleet-mcp/
site_author: Soumyaranjan Dash
repo_url: https://github.com/sr-dash/heliofleet-mcp
repo_name: sr-dash/heliofleet-mcp
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2026 Soumyaranjan Dash, National Solar Observatory · MIT licence ·
  <a href="https://doi.org/10.5281/zenodo.24409982">doi:10.5281/zenodo.24409982</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-8X5BSNF3VV
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/sr-dash/heliofleet-mcp/issues/new" target="_blank" rel="noopener">opening an issue</a>.
  google_site_verification: wNt-P7enH5ZTT0cjYYqXEN9GRrj-0_OcbZSER57FIK4
  keywords: >-
    heliophysics, solar physics, spacecraft positions, Parker Solar Probe, Solar Orbiter, STEREO,
    BepiColombo, SDO, SOHO, Aditya-L1, JPL Horizons, ephemeris, spacecraft alignment, quadrature,
    solar conjunction, perihelion, Stonyhurst, Carrington longitude, heliographic coordinates,
    viewing geometry, PFSS, magnetic connectivity, Parker spiral, solar wind, space weather,
    MCP server, Model Context Protocol, Python, SunPy
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sr-dash/heliofleet-mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/heliofleet-mcp/
    - icon: material/satellite-variant
      link: https://sr-dash.github.io/heliofleet/
    - icon: material/magnet
      link: https://sr-dash.github.io/heliofield/

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - MCP tools: tools.md
      - Command line: command-line.md
      - Python: python.md
      - Skill and plugins: skill.md
      - Methods and data: methods.md
  - API reference:
      - api/index.md
      - Fleet (geometry): api/geometry.md
      - Observations: api/observations.md
      - HelioField: api/heliofield.md
      - Data sources: api/data.md
      - Frames: api/frames.md
      - Time: api/timeutil.md
      - Links: api/links.md
      - Bodies: api/catalog.md
      - Command line: api/cli.md
  - Project:
      - Contributing: contributing.md
      - Citing: citing.md
      - Changelog: changelog.md
      - Privacy: privacy.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
            show_if_no_docstring: false
