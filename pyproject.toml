[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heliofleet-mcp"
dynamic = ["version"]
description = "MCP server for heliophysics spacecraft geometry from HelioFleet's published ephemerides"
readme = "README.md"
license = "MIT"
authors = [{ name = "Soumyaranjan Dash" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
keywords = [
  "heliophysics",
  "solar physics",
  "spacecraft",
  "ephemeris",
  "JPL Horizons",
  "Parker Solar Probe",
  "Solar Orbiter",
  "STEREO",
  "heliographic coordinates",
  "Carrington longitude",
  "Stonyhurst",
  "spacecraft alignment",
  "quadrature",
  "solar conjunction",
  "perihelion",
  "PFSS",
  "magnetic connectivity",
  "Parker spiral",
  "solar wind",
  "space weather",
  "sunpy",
  "mcp",
  "mcp-server",
  "model context protocol",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7", "sunpy>=6", "astropy>=6"]

[project.scripts]
heliofleet-mcp = "heliofleet_mcp.cli:main"

[project.urls]
HelioFleet = "https://sr-dash.github.io/heliofleet/"
HelioField = "https://sr-dash.github.io/heliofield/"
Source = "https://github.com/sr-dash/heliofleet-mcp"
Issues = "https://github.com/sr-dash/heliofleet-mcp/issues"
Changelog = "https://github.com/sr-dash/heliofleet-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "heliofleet_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (HelioFleet site or JPL Horizons)"]
