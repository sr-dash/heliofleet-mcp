[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heliofleet-mcp"
dynamic = ["version"]
description = "MCP server for heliophysics spacecraft geometry from HelioFleet's published ephemerides"
readme = "README.md"
license = "MIT"
authors = [{ name = "Soumyaranjan Dash" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
keywords = [
  "heliophysics",
  "solar physics",
  "spacecraft",
  "ephemeris",
  "JPL Horizons",
  "Parker Solar Probe",
  "Solar Orbiter",
  "STEREO",
  "heliographic coordinates",
  "Carrington longitude",
  "Stonyhurst",
  "spacecraft alignment",
  "quadrature",
  "solar conjunction",
  "perihelion",
  "PFSS",
  "magnetic connectivity",
  "Parker spiral",
  "solar wind",
  "space weather",
  "sunpy",
  "mcp",
  "mcp-server",
  "model context protocol",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5", "sunpy>=6", "astropy>=6"]
lint = ["ruff>=0.6"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
heliofleet-mcp = "heliofleet_mcp.cli:main"

[project.urls]
Documentation = "https://sr-dash.github.io/heliofleet-mcp/"
HelioFleet = "https://sr-dash.github.io/heliofleet/"
HelioField = "https://sr-dash.github.io/heliofield/"
Source = "https://github.com/sr-dash/heliofleet-mcp"
Issues = "https://github.com/sr-dash/heliofleet-mcp/issues"
Changelog = "https://github.com/sr-dash/heliofleet-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "heliofleet_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The docstring examples run as doctests with the tests (they read real data for fixed past dates)
testpaths = ["tests", "src/heliofleet_mcp"]
addopts = "--doctest-modules --ignore=src/heliofleet_mcp/__main__.py"
markers = ["network: needs internet access (HelioFleet site or JPL Horizons)"]

[tool.coverage.run]
source = ["heliofleet_mcp"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# PEP 8 (pycodestyle errors and warnings), pyflakes, and numpydoc docstrings (pydocstyle)
select = ["E", "W", "F", "D"]
ignore = ["D401"]  # summaries may be noun phrases ("Unit vector along a 3-vector.")

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# MCP tool docstrings are the descriptions clients show; they stay as written
"src/heliofleet_mcp/server.py" = ["D205", "D209"]
"src/heliofleet_mcp/heliofield.py" = ["D205", "D209"]
"tests/*" = ["D"]
"scripts/*" = ["D"]
